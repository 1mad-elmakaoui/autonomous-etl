# Continuous integration.
#
# Two properties make this cheap enough to run on every push, and they are the
# same two that make it meaningful:
#
# * `ETLM_LLM_PROVIDER=scripted` — the whole suite runs against recorded model
#   responses through the *real* agent loop. No API key, no per-run cost, and a
#   missing recorded turn raises `ScriptExhaustedError` rather than quietly
#   returning something plausible. CI therefore exercises agent behaviour rather
#   than mocking it away.
# * The Spark tier is split out. It needs a JVM and takes minutes, so it runs as
#   its own job in parallel with the fast one rather than serialising behind it.
#
# Every step below is a command that can be run locally — `make lint`,
# `make typecheck`, `make test-fast`, `make audit`. If a step here has no local
# equivalent, the first person to hit a red build has no way to reproduce it.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more say so themselves; nothing
# here writes to the repository.
permissions:
  contents: read

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: the scripted provider is also the default in `config.py`,
  # but stating it here means a change to that default cannot silently start
  # billing an API key into CI.
  ETLM_LLM_PROVIDER: scripted
  ETLM_LLM_FIXTURE_DIR: fixtures/llm
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy (strict)
        run: python -m mypy src

  test:
    name: tests (no JVM) · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range in pyproject's requires-python. The
        # floor is the one that actually breaks: it is where a 3.12-only syntax
        # or stdlib addition shows up.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit, agent, workflow and delivery tests
        run: python -m pytest -m "not spark and not integration" -q

  spark:
    name: tests (Spark, real execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Spark 4 requires 17+. 21 is what the project is developed against.
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the Spark extra
        run: python -m pip install -e ".[dev,spark]"
      - name: Generate the example input data
        run: python examples/customer_pipeline/generate_data.py --rows 2000
      - name: Equivalence, repair, optimisation and delivery end to end
        # These execute both pipelines for real and diff their output. This is
        # the job that can actually say the migration is correct.
        run: python -m pytest -m spark -q
        timeout-minutes: 45

  integration:
    name: tests (real Temporal server)
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: temporal
          POSTGRES_PASSWORD: temporal
          POSTGRES_DB: temporal
        options: >-
          --health-cmd "pg_isready -U temporal"
          --health-interval 5s --health-timeout 5s --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.29.0
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_USER: temporal
          POSTGRES_PWD: temporal
          POSTGRES_SEEDS: postgresql
        ports:
          - 7233:7233
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Durable pause, approval, idempotency and replay determinism
        run: python -m pytest -m integration -q
        timeout-minutes: 20

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pip-audit
        # This is not decorative: it is what found PYSEC-2026-1845 in pytest
        # 8.4.2, which the project's own `<9` pin was excluding the fix for.
        run: python -m pip_audit --strict --progress-spinner=off

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install kubeconform
        # Pinned, checksum-verified, and fetched from the release rather than
        # through a marketplace action — the same reasoning as the Trivy step
        # below. A tag is mutable; a sha256 of the artefact is not.
        env:
          KUBECONFORM_VERSION: "0.7.0"
          KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Validate manifests and their policies
        # The schema check needs the binary above; the policy checks — non-root,
        # default-deny egress, no credentials on the executing worker — do not,
        # and run everywhere.
        run: python -m pytest tests/test_kubernetes.py -q

  image:
    name: build and scan images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build the CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          push: false
          load: true
          tags: etl-migrator:cli
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          build-args: INSTALL_SPARK=true
          push: false
          load: true
          tags: etl-migrator:worker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The images actually run
        # A build that succeeds and an image that starts are different claims.
        # These are the smoke tests that tell them apart, and they need no
        # network, no API key and no Temporal server.
        run: |
          docker run --rm etl-migrator:cli --help
          docker run --rm etl-migrator:worker java -version
          docker run --rm --entrypoint python etl-migrator:worker \
            -c "import pyspark, etl_migrator; print('pyspark', pyspark.__version__)"

      - name: The images do not run as root
        # Generated code is untrusted, and the process that spawns it must
        # not be uid 0. Asserted rather than assumed — a stray `USER root` at
        # the end of a Dockerfile is an easy and silent regression.
        run: |
          for image in etl-migrator:cli etl-migrator:worker; do
            uid="$(docker run --rm --entrypoint id "$image" -u)"
            echo "$image runs as uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$image runs as root"; exit 1; }
          done

      - name: Scan images for vulnerabilities
        # Deliberately NOT `aquasecurity/trivy-action`. In March 2026 an
        # attacker force-pushed 75 of its 76 version tags to serve an
        # infostealer that harvested CI/CD secrets from Actions runners
        # (GHSA-cxm3-wv7p-598c), and the aquasec/trivy images 0.69.4-0.69.6 and
        # `latest` were compromised alongside it. Running the scanner from a
        # pinned Debian package keeps the supply chain to one apt repository
        # with a checked signature, and this workflow pins every action it does
        # use — a tag is mutable, which is precisely what that attack exploited.
        env:
          TRIVY_VERSION: "0.69.3"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y "trivy=${TRIVY_VERSION}"
          for image in etl-migrator:cli etl-migrator:worker; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --format table "$image"
          done
