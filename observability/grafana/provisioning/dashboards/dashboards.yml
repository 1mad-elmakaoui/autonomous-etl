apiVersion: 1
providers:
  - name: autonomous-etl
    type: file
    # Provisioned dashboards are read-only in the UI on purpose: a change made
    # by clicking is lost on the next restart, and a dashboard that silently
    # reverts is worse than one that refuses to be edited.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
